# Install on the VPS host. Certbot will add HTTPS and the HTTP redirect.
server {
    listen 80;
    listen [::]:80;
    server_name mushroom.kitsakorn.com;

    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        # Replace client-supplied forwarded headers: Express trusts one hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE must reach the browser immediately and stay connected.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
